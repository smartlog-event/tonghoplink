*{box-sizing:border-box}
:root{
  --brand:#3543F6;      /* Smartlog Blue  */
  --electric:#2438FF;   /* Electric Blue  */
  --navy:#07184F;       /* Deep Navy      */
  --white:#FFFFFF;
  --pale:#EEF3FF;       /* Pale Blue      */
  --field:#1835F5;      /* Background Blue — nền khu vực chứa nút */
  --ease:cubic-bezier(.2,0,.2,1);
  /* góc cắt kỹ thuật, dùng chung cho nút và ô mũi tên */
  --cut:polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%);
  --z-bar:10; --z-alert:20;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100dvh; display:flex; flex-direction:column;
  background:var(--field); color:var(--navy);
  font-family:'Be Vietnam Pro',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
  font-weight:600;
}

#stale{
  display:none; position:relative; z-index:var(--z-alert);
  background:var(--navy); color:var(--white); font-size:14px; font-weight:600;
  padding:10px 14px; text-align:center;
}
html[data-cache="stale"] #stale{display:block}

/* ---------- header: nền trắng, logo trái, nút cài đặt phải ---------- */
header{
  flex:0 0 auto; position:sticky; top:0; z-index:var(--z-bar);
  min-height:92px; display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 22px; padding-top:calc(16px + env(safe-area-inset-top));
  background:var(--white);
  box-shadow:0 1px 0 var(--navy), 0 5px 0 rgba(7,24,79,.16);   /* đường viền kép */
}
.logo{display:block;height:36px;width:auto}
.gear{
  flex:0 0 auto; width:46px; height:46px; display:grid; place-items:center;
  color:var(--navy); border:1px solid var(--navy); background:transparent;
  text-decoration:none; -webkit-tap-highlight-color:transparent;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.gear:hover{background:var(--navy);color:var(--white)}
.gear:active{background:var(--navy);color:var(--white)}
.gear:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- khu vực nút: nền xanh, chiếm phần còn lại, căn giữa dọc ---------- */
main{
  flex:1 0 auto; display:flex; position:relative;
  padding:30px 22px calc(34px + env(safe-area-inset-bottom));
  background-color:var(--field);
  /* dot matrix — hoạ tiết trung tính, không mang ý nghĩa nội dung */
  background-image:radial-gradient(rgba(255,255,255,.17) 1px, transparent 1.3px);
  background-size:22px 22px;
}
/* margin:auto để căn giữa dọc mà khi nhiều nút vẫn cuộn tới được nút đầu */
.wrap{margin:auto; width:100%; max-width:620px; position:relative}
@media (min-width:900px){ .wrap{max-width:920px} }

/* corner bracket — chi tiết kỹ thuật ở hai góc đối */
.wrap::before,.wrap::after{
  content:''; position:absolute; width:15px; height:15px; pointer-events:none;
  border:1px solid rgba(255,255,255,.5);
}
.wrap::before{top:-14px;left:-9px;border-right:0;border-bottom:0}
.wrap::after{bottom:-14px;right:-9px;border-left:0;border-top:0}

.grid{display:grid; gap:14px; grid-template-columns:1fr; counter-reset:t}
@media (min-width:900px){ .grid{grid-template-columns:1fr 1fr; gap:16px} }

/* ---------- nút: 3 vùng cố định, không phụ thuộc nội dung ---------- */
.tile{
  counter-increment:t;
  display:grid; grid-template-columns:26% 1fr 58px; align-items:center;
  min-height:128px;
  background:var(--white); color:var(--navy); text-decoration:none;
  clip-path:var(--cut);
  /* offset shadow: drop-shadow chạy SAU clip-path nên bóng theo đúng góc cắt */
  filter:drop-shadow(5px 5px 0 rgba(7,24,79,.85));
  touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  transition:transform .15s var(--ease), filter .15s var(--ease);
}
/* vùng 1 — số thứ tự, sinh bằng CSS counter nên không dính vào dữ liệu */
.num{
  display:grid; place-items:center; align-self:stretch;
  font-weight:700; font-size:64px; line-height:1;
  color:var(--navy); opacity:.14;
  user-select:none; -webkit-user-select:none;
}
.num::before{content:counter(t,decimal-leading-zero)}
/* vùng 2 — nội dung động, tối đa 3 dòng rồi cắt bằng ellipsis */
.lb{
  padding:0 14px 0 18px;
  border-left:1px solid rgba(7,24,79,.16);
  align-self:center;
  font-weight:600; font-size:26px; line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; overflow-wrap:break-word;
}
/* vùng 3 — hành động, chiều rộng cố định */
.act{
  justify-self:end; margin-right:14px;
  width:44px; height:44px; display:grid; place-items:center;
  background:var(--brand); color:var(--white);
  clip-path:polygon(0 0, calc(100% - 7px) 0, 100% 7px, 100% 100%, 0 100%);
  transition:translate .15s var(--ease);
}

@media (hover:hover){
  .tile:hover{transform:translateY(-2px);filter:drop-shadow(7px 7px 0 rgba(7,24,79,.9))}
  .tile:hover .act{translate:3px 0}
}
.tile:active{transform:translateY(2px);filter:drop-shadow(2px 2px 0 rgba(7,24,79,.8))}
/* outline bị clip-path cắt mất, nên dùng viền trong để báo focus */
.tile:focus-visible{box-shadow:inset 0 0 0 3px var(--electric)}

/* tablet: vẫn 1 cột, ô hẹp hơn nên hạ số thứ tự một nấc */
@media (min-width:600px) and (max-width:899px){
  .num{font-size:56px}
}
/* điện thoại từ 7 nút trở lên: chia 2 cột, giữ nguyên 3 vùng, thu nhỏ đồng loạt */
@media (max-width:599px){
  .grid:has(>a:nth-child(7)){grid-template-columns:1fr 1fr; gap:12px}
  .grid:has(>a:nth-child(7)) .tile{grid-template-columns:52px 1fr 34px; min-height:112px}
  .grid:has(>a:nth-child(7)) .num{font-size:40px}
  .grid:has(>a:nth-child(7)) .lb{font-size:17px; padding:0 8px 0 10px}
  .grid:has(>a:nth-child(7)) .act{width:32px; height:32px; margin-right:10px}
  .grid:has(>a:nth-child(7)) .act svg{width:16px;height:16px}
}
/* máy rất hẹp (iPhone SE): số thứ tự không được đè lên vùng nội dung */
@media (max-width:360px){
  .num{font-size:50px}
  .lb{font-size:23px;padding:0 10px 0 14px}
}

@media (prefers-reduced-motion:reduce){
  .tile,.act{transition:filter .15s linear}
  .tile:hover,.tile:active{transform:none}
  .tile:hover .act{translate:none}
}

.empty{
  display:none; color:var(--white); font-size:17px; font-weight:600;
  text-align:center; padding:44px 8px; line-height:1.5;
}
.grid:not(:has(>a))+.empty{display:block}
</style>
</head>

  // Báo cho sale biết đang xem bản lưu, kèm mốc thời gian lưu
  var sa=document.documentElement.getAttribute('data-saved-at');
  if(sa){
    var t=new Date(Number(sa));
    if(!isNaN(t)){
      var p=function(n){return (n<10?'0':'')+n};
      document.getElementById('stale').textContent=
        'Đang xem bản lưu lúc '+p(t.getHours())+':'+p(t.getMinutes())+' — link có thể đã cũ';
    }
  }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(function(){});
  }
})();
